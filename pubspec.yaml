name: telnyx_common
description: A high-level, state-agnostic, drop-in module for the Telnyx Flutter SDK that simplifies WebRTC integration.
version: 0.2.0
homepage: https://telnyx.com/
repository: https://github.com/team-telnyx/flutter-voice-commons
issue_tracker: https://github.com/team-telnyx/flutter-voice-commons/issues


environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  telnyx_webrtc:
    git:
      url: https://github.com/team-telnyx/flutter-voice-sdk.git
      # Pinned to the VSDK-769 merge commit on `main`
      # (`b3c79292 feat(flutter-sdk): emit mobile SDK identity with wrapper override`).
      # The previous `vsdk-769-sdk-identity-override` branch ref was fragile
      # (auto-deletion after merge or force-push would break this dep).
      # This is still a Git dep; Codex P1 #1 ("restore a hosted dependency before
      # publishing") is deferred until upstream `telnyx_webrtc` ships a release
      # (>= 4.5.1 / 4.6.0) exposing `Config.mobile_sdk_name`. See VSDK-770.
      ref: b3c79292a193b2794c55c5cc88c13f9a68947811
      path: packages/telnyx_webrtc
  flutter_callkit_incoming: ^2.5.8
  uuid: ^4.0.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.3.0
  shared_preferences: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
